<text x="55" y="1200" font-family="Arial,sans-serif" font-size="15" fill="#475569">La obligatoriedad del padre se ve en el FK del hijo: ? = referencia opcional; sin ? = obligatoria. Tipos completos en DICCIONARIO.md.</text>

<text x="55" y="680" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">3 entidades · 2 claves foráneas visibles · zoom recomendado: 100% o más.</text>
<text x="55" y="708" font-family="Arial,sans-serif" font-size="15" fill="#475569">El catálogo numerado de relaciones está en el archivo er_infraestructura_relaciones.md; Mermaid conserva nombres completos de FK.</text>
<text x="55" y="735" font-family="Arial,sans-serif" font-size="15" fill="#475569">La obligatoriedad del padre se ve en el FK del hijo: ? = referencia opcional; sin ? = obligatoria. Tipos completos en DICCIONARIO.md.</text>
